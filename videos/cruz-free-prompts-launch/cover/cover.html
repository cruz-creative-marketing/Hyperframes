<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cruz Free Prompts — cover</title>
    <!-- Static 1080×1920 cover for the launch video. Rendered to cover.png by cover/render-cover.mjs.
         Key content stays inside the centre 1080×1350 band (y 285–1635) so the 4:5 grid crop keeps it. -->
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("../assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("../assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("../assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; background: #0a0909; overflow: hidden; }
      body { position: relative; color: #ffffff; font-family: "Montserrat", sans-serif; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; }

      #glow {
        position: absolute; left: 540px; top: 1060px; width: 1300px; height: 900px;
        margin: -450px 0 0 -650px;
        background: radial-gradient(closest-side, rgba(165, 240, 177, 0.13), rgba(165, 240, 177, 0));
      }
      #logo { position: absolute; left: 290px; top: 300px; width: 500px; height: 88px; }
      #head {
        position: absolute; left: 40px; right: 40px; top: 440px; text-align: center;
        font-weight: 900; font-size: 112px; line-height: 1.04; letter-spacing: -0.045em; text-transform: lowercase;
      }
      #head span { display: block; }
      #head .mint { color: #a5f0b1; }

      #cards { position: absolute; left: 0; right: 0; top: 770px; height: 600px; perspective: 1800px; }
      .card { position: absolute; top: 20px; width: 400px; }
      .card .label { font-size: 19px; height: 34px; color: #cccccc; }
      .card .frame { position: relative; width: 400px; height: 533px; border: 1px solid #2e2929; background: #141212; }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #left { left: 105px; transform: rotateY(10deg) rotate(-3deg); }
      #left img { opacity: 0.5; }
      #right { left: 575px; transform: rotateY(-10deg) rotate(3deg); }
      #right .label { color: #a5f0b1; }
      #right .frame { border: 3px solid #a5f0b1; }
      .pill {
        position: absolute; left: 50%; bottom: -30px; width: 330px; margin-left: -165px; height: 60px; border-radius: 30px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 24px; letter-spacing: -0.01em; text-transform: lowercase;
      }
      #left .pill { background: #0a0909; color: #f0a5a5; border: 2px solid #f0a5a5; }
      #right .pill { background: #a5f0b1; color: #0a0909; }

      #chip {
        position: absolute; left: 50%; top: 1420px; width: 700px; margin-left: -350px; height: 128px;
        background: #a5f0b1; color: #0a0909; display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 78px; letter-spacing: -0.04em; text-transform: lowercase;
      }
      #url { position: absolute; left: 0; right: 0; top: 1580px; text-align: center; font-size: 28px; color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="glow"></div>
    <img id="logo" src="../assets/logo-8fccc9a2.svg" alt="Cruz Creative" />
    <div id="head"><span>same ai.</span><span class="mint">better prompt.</span></div>
    <div id="cards">
      <div class="card" id="left">
        <div class="label mono">Generic prompt</div>
        <div class="frame">
          <img src="../assets/generic-ai-poster-for-a-gym-stock-templa.webp" alt="" />
          <div class="pill">looks like everyone else</div>
        </div>
      </div>
      <div class="card" id="right">
        <div class="label mono">Our prompt</div>
        <div class="frame">
          <img src="../assets/on-brand-ai-poster-for-a-gym-matches-the.webp" alt="" />
          <div class="pill">looks like your brand</div>
        </div>
      </div>
    </div>
    <div id="chip">15 prompts. free.</div>
    <div id="url" class="mono">freeprompts.cruzcreative.net</div>
  </body>
</html>
