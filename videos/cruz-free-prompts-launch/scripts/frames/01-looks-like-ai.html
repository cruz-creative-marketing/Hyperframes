      [["#f01-a", 0.06], ["#f01-b", 0.49], ["#f01-c", 0.73]].forEach(([sel, t]) => {

      const B = document.getElementById("f01-b");
      const C = document.getElementById("f01-c");
      const posters = [0, 1, 2].map((i) => document.getElementById("f01-p" + i));
      const POSTERS = [
        { t: 0.06, i: 0 }, { t: 0.49, i: 1 }, { t: 0.73, i: 2 },
        { t: 1.65, i: 0 }, { t: 2.14, i: 1 }, { t: 2.43, i: 2 },
      ];
      function stateAt(t) {
        let p = -1;
        for (const s of POSTERS) if (t >= s.t) p = s.i;
        return {
          a: t >= 1.65 ? "looks like" : "your",
          c: t >= 2.6 ? "content." : "content…",
          mint: t >= 2.43,
          poster: p,
        };
      }
      const driver = { t: 0 };
      tl.fromTo(driver, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: () => {
          const s = stateAt(driver.t);
          A.textContent = s.a;
          C.textContent = s.c;
          B.style.color = C.style.color = s.mint ? "#a5f0b1" : "#ffffff";
          posters.forEach((el, i) => (el.style.opacity = i === s.poster ? "0.42" : "0"));
          // sine-wave-loop, low-amplitude register: subtle jitter on the held mint line only (t >= 2.6s)
          const j = driver.t >= 2.75 ? Math.sin((driver.t - 2.75) * 38) : 0;
          gsap.set([B, C], { x: j * 1.6, y: j * -1.1 });

</script>
